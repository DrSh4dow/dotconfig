# ---- Float common dialog-ish classes ----
windowrule = float on, match:class ^(file_progress)$
windowrule = float on, match:class ^(confirm)$
windowrule = float on, match:class ^(dialog)$
windowrule = float on, match:class ^(download)$
windowrule = float on, match:class ^(notification)$
windowrule = float on, match:class ^(error)$
windowrule = float on, match:class ^(splash)$
windowrule = float on, match:class ^(confirmreset)$

# These two looked incorrect in the old syntax ("class:title:...").
# Interpreting them as title matches:
windowrule = float on, match:initial_title ^(Open File)$
windowrule = float on, match:initial_title ^(branchdialog)$

windowrule = float on, match:class ^(Lxappearance)$
windowrule = float on, match:class ^(Rofi)$
windowrule = no_anim on, match:class ^(Rofi)$

windowrule = float on, match:class ^(viewnior)$
windowrule = float on, match:class ^(Viewnior)$
windowrule = float on, match:class ^(feh)$

windowrule = float on, match:class ^(pavucontrol-qt)$
windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(file-roller)$

windowrule = float on, match:initial_title DevTools

# wlogout
windowrule = fullscreen on, match:class ^(wlogout)$
windowrule = fullscreen on, match:initial_title ^(wlogout)$

# mpv idle inhibit
windowrule = idle_inhibit focus, match:class ^(mpv)$

# ---- Title-based float rules (use initial_title for static float robustness) ----
windowrule = float on, match:initial_title ^(Media viewer)$
windowrule = float on, match:initial_title ^(Volume Control)$
windowrule = float on, match:initial_title ^(Picture-in-Picture)$

# Volume Control geometry
windowrule = float on, size 800 600, move 75 44%, match:initial_title ^(Volume Control)$

# Firefox sharing indicator (generic)
windowrule = float on, match:initial_title ^(Firefox — Sharing Indicator)$

windowrule = float on, match:initial_title ^(Calculator)$
windowrule = float on, match:initial_title ^(Progress)$
windowrule = float on, match:initial_title ^(zenity)$
windowrule = float on, match:initial_title ^(video0)$

windowrule = float on, match:class ^(yad)$
windowrule = float on, match:class ^(qt5ct)$
windowrule = float on, match:class ^(qt6ct)$
windowrule = float on, match:class ^(floating_shell_portrait)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(xsensors)$
windowrule = float on, match:class ^(image-roll)$

# Qalculate
windowrule = float on, match:class ^(qalculate-qt)$, match:title ^(Qalculate!)$

# ---- Workspace-based decoration tweaks (old windowrulev2 -> new match:* props) ----
windowrule = border_size 0, rounding 0, match:float 0, match:workspace w[tv1]
windowrule = border_size 0, rounding 0, match:float 0, match:workspace f[1]

# ---- Firefox Picture-in-Picture (more specific) ----
windowrule = float on, pin on, match:initial_class ^(firefox)$, match:initial_title ^(Picture-in-Picture)$

# ---- Firefox figma micro indicator ----
windowrule = float on, match:initial_class ^(firefox)$, match:initial_title ^(Firefox — Sharing Indicator)$

# ---- Telegram media viewer ----
windowrule = float on, center on, monitor 1, match:initial_class ^(org.telegram.desktop)$, match:initial_title ^(Media viewer)$

# ---- Common modals ----
windowrule = float on, match:initial_title ^(Open)$
windowrule = float on, match:initial_title ^(Choose Files)$
windowrule = float on, match:initial_title ^(Save As)$
windowrule = float on, match:initial_title ^(Confirm to replace files)$
windowrule = float on, match:initial_title ^(File Operation Progress)$

# ---- taskwarrior ----
windowrule = float on, center on, dim_around on, decorate off, match:class ^(task-floating)$

# ---- duplicates retained (but normalized) ----
windowrule = center on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(file-roller)$

# ---- JetBrains PhpStorm license dialog ----
# Old regex looked like it wanted "License ..." titles; using a safe prefix match:
windowrule = float on, center on, dim_around on, match:class ^(jetbrains-phpstorm)$, match:initial_title ^License
